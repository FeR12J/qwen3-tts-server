[project]
name = "qwen3-tts-server"
version = "1.1.0"
description = "Servidor FastAPI para TTS (Qwen3-TTS) y transcripción (Whisper) local"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "venv",
    "models",
    "audios",
    "benchmarks/results",
]

[tool.ruff.lint]
# Errores reales: sintaxis (E9), imports rotos/innecesarios (F),
# y errores de lógica comunes (E4/E7). Sin reformateo ni estilo.
select = ["E4", "E7", "E9", "F"]
